<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山河棋局 · 真实地图预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#2f4a3e;font-family:system-ui,'PingFang SC',sans-serif}header{padding:22px 30px;background:white;border-bottom:1px solid #dce5df;display:flex;align-items:center;justify-content:space-between;gap:15px}h1{font-size:20px;margin:0 0 5px}p{font-size:12px;color:#8a9d91;margin:0}.tabs{display:flex;gap:8px;padding:16px 30px}.tabs button,.toolbar button{border:1px solid #d7e2da;background:white;color:#6a8473;border-radius:7px;padding:9px 15px;font:inherit;font-size:12px;cursor:pointer}.tabs button.active{background:#345c45;color:white;border-color:#345c45}.toolbar{display:flex;align-items:center;gap:8px;font-size:12px;color:#91a399}.viewer{margin:0 22px 20px;height:calc(100vh - 156px);min-height:350px;overflow:auto;background:white;border:1px solid #dfe7e1;border-radius:10px;text-align:center}.viewer img{display:block;width:100%;max-width:none;height:auto;margin:0 auto}.note{font-size:11px;color:#82988a;line-height:1.7;padding:0 30px 20px}@media(max-width:650px){header{padding:18px;align-items:flex-start;flex-direction:column}.tabs{padding:12px 18px}.tabs button{padding:8px}.viewer{margin:0 10px 14px;height:65vh}.note{padding:0 18px}}
</style></head><body><header><div><h1>山河棋局 · 真实地图预览 V2</h1><p>地图评审阶段 · 真实海岸与水系 · 实测高程地形 · 原游戏文件保留</p></div><div class="toolbar"><button id="less">−</button><span id="scale">100%</span><button id="more">+</button><button id="fit">适应宽度</button></div></header><div class="tabs"><button class="active" data-image="china-map.png">中国全图</button><button data-image="asia-map.png">亚洲全图</button><button data-image="zhejiang-shanghai-detail.png">浙江—上海细节</button></div><div class="viewer"><img id="map" src="output/china-map.png" alt="真实地理地图预览"></div><div class="note">数据来源：<a href="https://www.naturalearthdata.com/downloads/10m-physical-vectors/">Natural Earth</a> · <a href="https://www.geoboundaries.org/api.html">geoBoundaries</a> · <a href="https://registry.opendata.aws/terrain-tiles/">Mapzen Terrain Tiles / USGS / NOAA</a>。海岸线与主要河流按公开数据的精度绘制；地块为游戏用途的县域合并方案。</div><script>
const image=document.getElementById('map');let zoom=100;function setZoom(n){zoom=Math.max(50,Math.min(300,n));image.style.width=zoom+'%';document.getElementById('scale').textContent=zoom+'%'}document.getElementById('more').onclick=()=>setZoom(zoom+25);document.getElementById('less').onclick=()=>setZoom(zoom-25);document.getElementById('fit').onclick=()=>setZoom(100);document.querySelectorAll('[data-image]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-image]').forEach(x=>x.classList.remove('active'));button.classList.add('active');image.src='output/'+button.dataset.image;setZoom(100)});
</script></body></html>
