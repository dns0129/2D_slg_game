<style>
/*__MAPLIBRE_CSS__*/

   county details on the right (bottom sheet on phones). */
:root {

  --ink-2: #4f5955;

  --land: #e4e3dc;
  --allied: #2a78d6;
  --axis: #eb6834;
  --contested: #1baf7a;
  --neutral: #b8b5a8;
  --focus: #2a78d6;
  --shadow: 0 1px 2px rgb(20 30 28 / 0.08), 0 6px 18px rgb(20 30 28 / 0.10);
  --f-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #151b1d; --sheet: #1d2427; --ink: #eef1ee; --ink-2: #c1c8c4; --muted: #8b958f; --rule: #34403f;
    --sea: #10181d; --land: #232b2c; --allied: #3987e5; --axis: #d95926; --contested: #199e70; --neutral: #5a5f5a;
    --focus: #6aa9f0; --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #151b1d; --sheet: #1d2427; --ink: #eef1ee; --ink-2: #c1c8c4; --muted: #8b958f; --rule: #34403f;
  --sea: #10181d; --land: #232b2c; --allied: #3987e5; --axis: #d95926; --contested: #199e70; --neutral: #5a5f5a;
  --focus: #6aa9f0; --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 8px 24px rgb(0 0 0 / 0.35); color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 var(--f-body); overflow: hidden; }
.app { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr; }
header.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
  padding: 10px 16px; background: var(--sheet); border-bottom: 1px solid var(--rule); z-index: 3;
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { margin: 0; font: 700 18px/1.2 var(--f-display); letter-spacing: 0.02em; text-wrap: balance; }
.brand small { color: var(--muted); font: 12px/1.3 var(--f-body); }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; flex: 1 1 520px; min-width: 0; }
nav.tabs button {
  flex: 0 0 auto; border: 1px solid var(--rule); background: transparent; color: var(--ink-2);
  border-radius: 6px; padding: 5px 10px 6px; cursor: pointer; text-align: left; font: inherit;
}
nav.tabs button .d { display: block; font: 500 13px/1.2 var(--f-mono); color: var(--ink); }
nav.tabs button .t { display: block; font-size: 11.5px; line-height: 1.3; max-width: 13em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
nav.tabs button[aria-selected="true"] { background: var(--ink); border-color: var(--ink); color: var(--sheet); }
nav.tabs button[aria-selected="true"] .d { color: var(--sheet); }
button:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
#map { position: absolute; inset: 0; background: var(--sea); }
.stage { position: relative; min-height: 0; }
.sheet {
  position: absolute; z-index: 2; background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px;
  box-shadow: var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 12px;
  max-height: calc(100% - 24px); overflow: auto;
}
.controls { left: 12px; top: 12px; width: 300px; }
.detail { right: 12px; top: 12px; width: 320px; }
.sheet h2 { margin: 0; font: 600 15px/1.35 var(--f-display); text-wrap: balance; }
.sheet h3 { margin: 0 0 6px; font: 500 11px/1.2 var(--f-body); color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.lede { margin: 0; color: var(--ink-2); font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 6px; }
.seg { display: flex; gap: 0; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: transparent; color: var(--ink-2); padding: 6px 4px; font: 500 12.5px var(--f-body); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); }
.legend { display: flex; flex-direction: column; gap: 5px; }
.legend .row { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 8px; font-size: 13px; }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgb(0 0 0 / 0.15); }
.num { font: 12px var(--f-mono); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bar-split { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; background: var(--rule); }
.bar-split span { display: block; height: 100%; }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 13px; }
.toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; border-radius: 4px; }
.search { position: relative; }
.search input {
  width: 100%; box-sizing: border-box; padding: 7px 10px; border: 1px solid var(--rule); border-radius: 7px;
  background: var(--paper); color: var(--ink); font: 13px var(--f-body);
}

.results button {
  width: 100%; text-align: left; border: 0; background: transparent; color: var(--ink); padding: 5px 6px;
  border-radius: 5px; cursor: pointer; font: 13px var(--f-body); display: flex; justify-content: space-between; gap: 8px;
}
.results button:hover { background: var(--paper); }
.results .meta { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.chip.hist { border-color: var(--allied); color: var(--allied); }

.chip.approx { border-style: dashed; }
.foot { color: var(--muted); font-size: 11.5px; margin: 0; }
.close { position: absolute; top: 8px; right: 8px; border: 0; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1; }
.tip {
  position: absolute; z-index: 4; pointer-events: none; background: var(--sheet); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px; box-shadow: var(--shadow);
  font-size: 12.5px; line-height: 1.4; max-width: 260px;
}
.tip b { font-weight: 700; }
.tip .num { display: block; }
.lbl { position: absolute; z-index: 1; pointer-events: none; transform: translate(-50%, -50%);
  font: 600 12px/1.15 var(--f-display); color: var(--ink); white-space: nowrap;
  text-shadow: 0 0 3px var(--paper), 0 0 3px var(--paper), 0 0 2px var(--paper); }
.lbl.small { font: 500 11px/1.1 var(--f-body); color: var(--ink-2); }
.loading { position: absolute; inset: 0; display: grid; place-items: center; z-index: 5; background: var(--paper); color: var(--ink-2); font: 14px var(--f-body); }
.loading[hidden] { display: none; }
.toggle-sheet { display: none; }
@media (max-width: 760px) {
  .brand small { display: none; }
  .controls { left: 8px; right: 8px; top: auto; bottom: 8px; width: auto; max-height: 46%; }
  .controls.collapsed > :not(.toggle-sheet):not(.head) { display: none; }
  .detail { left: 8px; right: 8px; top: 8px; width: auto; max-height: 42%; }
  .toggle-sheet { display: inline-block; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <h1>世界县级战局图 1939–1945</h1>
      <small>约五万个县级单元 · 六个时间断面 · 法理归属与实际控制</small>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="时间断面"></nav>
  </header>
  <div class="stage">
    <div id="map" role="region" aria-label="地图"></div>
    <div id="labels"></div>
    <aside class="sheet controls" id="controls" aria-label="图例与图层">
      <div class="head stack">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
          <h2 id="snapTitle">—</h2>
          <button class="seg-btn toggle-sheet chip" id="toggleSheet" type="button" aria-expanded="true">收起</button>
        </div>
        <p class="lede" id="snapLede"></p>
      </div>
      <div class="stack">
        <h3>着色</h3>
        <div class="seg" role="group" aria-label="着色方式">
          <button type="button" data-mode="bloc" aria-pressed="true">阵营</button>
          <button type="button" data-mode="density" aria-pressed="false">人口密度</button>
          <button type="button" data-mode="basis" aria-pressed="false">界线来源</button>
        </div>
      </div>
      <div class="stack">
        <h3 id="legendTitle">实际控制阵营 · 人口</h3>
        <div class="legend" id="legend"></div>
        <div class="bar-split" id="split" aria-hidden="true"></div>
        <p class="foot" id="legendNote">斜线 = 近似界定（按整区划分配，或沿用临近年份的占领范围）</p>
      </div>
      <div class="stack">
        <h3>图层</h3>
        <div class="toggles">
          <label><input type="checkbox" id="tCounty" checked> 县界</label>
          <label><input type="checkbox" id="tUnits" checked> 国界 / 殖民地界</label>
          <label><input type="checkbox" id="tTerrain" checked> 地形</label>
          <label><input type="checkbox" id="tHydro" checked> 河流湖泊</label>
          <label><input type="checkbox" id="tLabels" checked> 地名</label>
          <label><input type="checkbox" id="tApprox" checked> 近似斜线</label>
        </div>
      </div>
      <div class="stack search">
        <h3><label for="q">查找县</label></h3>
        <input id="q" type="search" placeholder="例如 宛平、Kursk、京城府" autocomplete="off">
        <ul class="results" id="results"></ul>
      </div>
      <p class="foot">点击任一县查看归属。数据：CShapes 2.0、geoBoundaries、Newberry 美国县界史、中研院台湾 1930、国史编纂委员会 1914–26、K. Lawson 东亚图层；人口为 GHS-POP 推算。</p>
    </aside>
    <aside class="sheet detail" id="detail" hidden aria-live="polite"></aside>
    <div class="tip" id="tip" hidden></div>
    <div class="loading" id="loading">正在载入县级数据…</div>
  </div>
</div>

<script src="vendor/maplibre-gl.js"></script>
<script>
const DEFAULT_SNAPSHOT = "__DEFAULT_SNAPSHOT__";
const BLOC_ZH = { allied: "同盟国一方", axis: "轴心国一方", neutral: "中立 / 维希", contested: "前线争夺" };
const STATUS_ZH = { independent: "独立国", colony: "殖民地", protectorate: "保护国", mandate: "委任统治地", occupied: "被占领地区", "N/A": "—" };
const TYPE_ZH = {
  independent: "本国统治", colony: "殖民统治", protectorate: "保护国", mandate: "委任统治", occupied: "军事占领",
  military_occupation: "军事占领", annexation: "吞并", partition: "瓜分", client_state: "傀儡 / 附庸政权",
  collaborationist_state: "合作政权（维希）", allied_occupation: "盟军占领", front_line: "前线争夺", besieged: "被围",
  resistance_base: "抗日根据地", leased_territory: "租借地", surrendering_forces: "待受降", satellite_state: "卫星国",
  liberated: "已解放", military_intervention: "军事干预", "N/A": "—"
};
const BASIS_ZH = {
  historical_dated: ["历史界线（按日期）", "hist"], historical_1930: ["历史界线（1930）", "hist"],
  historical_1931: ["历史界线（1931）", "hist"], reconstructed_1914_1926: ["据 1914–26 资料重建", "recon"],
  modern_proxy: ["现代界线代用", ""]
};
const DENSITY_STEPS = [5, 25, 50, 100, 250, 500];

const state = { snap: null, mode: "bloc", data: {}, geo: null, units: null, counties: null, selected: null, hover: null };
const $ = (id) => document.getElementById(id);
const fmt = (n) => n >= 1e8 ? (n / 1e8).toFixed(2) + " 亿" : n >= 1e4 ? (n / 1e4).toFixed(n >= 1e6 ? 0 : 1) + " 万" : String(Math.round(n));
const cssVar = (k) => getComputedStyle(document.documentElement).getPropertyValue(k).trim();

function decodeGeo(buf) {
  const b = new Uint8Array(buf); let i = 0; const out = [];
  const v = () => { let r = 0, s = 0, c; do { c = b[i++]; r += (c & 0x7f) * 2 ** s; s += 7; } while (c & 0x80); return r; };
  const z = () => { const n = v(); return (n % 2) ? -(n + 1) / 2 : n / 2; };
  while (i < b.length) {
    const np = v(); const polys = []; let px = 0, py = 0;
    for (let p = 0; p < np; p++) {
      const nr = v(); const rings = [];
      for (let r = 0; r < nr; r++) {
        const n = v(); const ring = new Array(n + 1);
        for (let k = 0; k < n; k++) { px += z(); py += z(); ring[k] = [px / 1000, py / 1000]; }
        ring[n] = ring[0]; rings.push(ring);
      }
      polys.push(rings);
    }
    out.push(polys);
  }
  return out;
}

async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error(u + " " + r.status); return r.json(); }
async function getBin(u) { const r = await fetch(u); if (!r.ok) throw new Error(u + " " + r.status); return r.arrayBuffer(); }

function col(name, ci) { const c = state.counties.cols[name]; return c.lut[c.idx[ci]]; }

function densityClass(pop, area) {
  const d = area > 0 ? pop / area : 0; let k = 0; while (k < DENSITY_STEPS.length && d >= DENSITY_STEPS[k]) k++; return k;
}

function buildFeatures(sd) {
  const feats = new Array(sd.feature.length);
  for (let k = 0; k < sd.feature.length; k++) {
    const f = sd.feature[k]; const ci = state.counties.feature_county[f];
    feats[k] = { type: "Feature", id: k, geometry: { type: "MultiPolygon", coordinates: state.geo[f] },
      properties: { b: sd.bloc[k], a: sd.conf[k], d: densityClass(sd.pop[k], state.counties.area[ci]), s: state.counties.basis[ci] } };
  }
  return { type: "FeatureCollection", features: feats };
}

function unitFeatures(sd) {
  return { type: "FeatureCollection", features: sd.units_active.map((u) => ({ type: "Feature", id: u,
    geometry: { type: "MultiPolygon", coordinates: state.units[u] }, properties: {} })) };
}

function fillColor() {
  const A = cssVar("--allied"), X = cssVar("--axis"), C = cssVar("--contested"), N = cssVar("--neutral");
  if (state.mode === "bloc") return ["match", ["get", "b"], 0, A, 1, X, 3, C, N];
  if (state.mode === "basis") return ["match", ["get", "s"], 0, A, 1, A, 2, A, 3, C, N];
  const ramp = ["#e8f0fa", "#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#184f95"];
  return ["match", ["get", "d"], 0, ramp[0], 1, ramp[1], 2, ramp[2], 3, ramp[3], 4, ramp[4], 5, ramp[5], ramp[6]];
}

function legend() {
  const sd = state.data[state.snap]; const L = $("legend"); L.replaceChildren(); const sp = $("split"); sp.replaceChildren();
  const add = (color, label, val) => {
    const row = document.createElement("div"); row.className = "row";
    const s = document.createElement("span"); s.className = "sw"; s.style.background = color;
    const t = document.createElement("span"); t.textContent = label;
    const n = document.createElement("span"); n.className = "num"; n.textContent = val ?? "";
    row.append(s, t, n); L.append(row);
  };
  if (state.mode === "bloc") {
    $("legendTitle").textContent = "实际控制阵营 · 人口";
    const total = Object.values(sd.bloc_pop).reduce((a, b) => a + b, 0);
    for (const [k, v] of [["allied", "--allied"], ["axis", "--axis"], ["contested", "--contested"], ["neutral", "--neutral"]]) {
      const p = sd.bloc_pop[k] || 0; add(cssVar(v), BLOC_ZH[k], `${fmt(p)} · ${(100 * p / total).toFixed(1)}%`);
      const seg = document.createElement("span"); seg.style.background = cssVar(v); seg.style.width = (100 * p / total) + "%"; sp.append(seg);
    }
    sp.hidden = false;
  } else if (state.mode === "basis") {
    $("legendTitle").textContent = "县级界线的来源";
    add(cssVar("--allied"), "当时的历史界线（美、台、缅）");
    add(cssVar("--contested"), "据 1914–26 资料重建（朝鲜）");
    add(cssVar("--neutral"), "现代界线代用（按当日国界切分）");
    sp.hidden = true;
  } else {
    $("legendTitle").textContent = "人口密度（人 / 平方公里，估计）";
    const ramp = ["#e8f0fa", "#cde2fb", "#9ec5f4", "#6da7ec", "#3987e5", "#256abf", "#184f95"];
    const lab = ["< 5", "5–25", "25–50", "50–100", "100–250", "250–500", "≥ 500"];
    ramp.forEach((c, i) => add(c, lab[i])); sp.hidden = true;
  }
}

let map;
function setLayers() {
  map.setPaintProperty("county-fill", "fill-color", fillColor());
  legend();
}

function placeLabels() {
  const box = $("labels"); box.replaceChildren();
  if (!$("tLabels").checked || !state.snap) return;
  const z = map.getZoom(); const sd = state.data[state.snap];
  const minArea = z < 2 ? 40 : z < 3 ? 8 : z < 4 ? 1.5 : z < 5 ? 0.3 : 0.02;
  const taken = []; const W = map.getContainer().clientWidth, H = map.getContainer().clientHeight;
  const cands = Object.values(sd.unit_labels).filter((l) => l[4] >= minArea).sort((a, b) => b[3] - a[3]);
  for (const [name, x, y] of cands.slice(0, 160)) {
    const p = map.project([x, y]); if (p.x < 0 || p.y < 0 || p.x > W || p.y > H) continue;
    const w = name.length * 12 + 6, h = 16; const r = [p.x - w / 2, p.y - h / 2, p.x + w / 2, p.y + h / 2];
    if (taken.some((t) => !(r[2] < t[0] || r[0] > t[2] || r[3] < t[1] || r[1] > t[3]))) continue;
    taken.push(r); const el = document.createElement("div"); el.className = "lbl"; el.textContent = name;
    el.style.left = p.x + "px"; el.style.top = p.y + "px"; box.append(el);
  }
  if (z >= 6.2) {
    const feats = map.queryRenderedFeatures({ layers: ["county-fill"] }); const seen = new Set();
    for (const f of feats) {
      if (seen.has(f.id) || taken.length > 260) continue; seen.add(f.id);
      const fi = sd.feature[f.id]; const ci = state.counties.feature_county[fi];
      const name = col("name_zh", ci) || col("name", ci); if (!name) continue;
      const [x, y] = state.counties.label[ci]; const p = map.project([x, y]);
      if (p.x < 0 || p.y < 0 || p.x > W || p.y > H) continue;
      const w = Math.min(name.length, 14) * 11 + 4, h = 14; const r = [p.x - w / 2, p.y - h / 2, p.x + w / 2, p.y + h / 2];
      if (taken.some((t) => !(r[2] < t[0] || r[0] > t[2] || r[3] < t[1] || r[1] > t[3]))) continue;
      taken.push(r); const el = document.createElement("div"); el.className = "lbl small"; el.textContent = name;
      el.style.left = p.x + "px"; el.style.top = p.y + "px"; box.append(el);
    }
  }
}

function describe(k) {
  const sd = state.data[state.snap]; const fi = sd.feature[k]; const ci = state.counties.feature_county[fi];
  const L = (c) => sd.luts[c][sd.rows[c][k]];
  return { sd, fi, ci, L, name: col("name_zh", ci) || col("name", ci), local: col("name", ci) };
}

function showTip(e, k) {
  const { sd, L, name, local } = describe(k); const tip = $("tip");
  tip.replaceChildren();
  const b = document.createElement("b"); b.textContent = name; tip.append(b);
  if (local && local !== name) tip.append(" · " + local);
  const l2 = document.createElement("div"); l2.textContent = `${L("unit_name_zh") || L("unit_name_en")} · 实际控制：${L("controller_name_zh") || L("controller_name_en")}`;
  const l3 = document.createElement("span"); l3.className = "num"; l3.textContent = `人口约 ${fmt(sd.pop[k])}`;
  tip.append(l2, l3);
  tip.hidden = false; const r = map.getContainer().getBoundingClientRect();
  tip.style.left = Math.min(e.point.x + 14, r.width - 270) + "px"; tip.style.top = (e.point.y + 14) + "px";
}

function showDetail(k) {
  const { sd, ci, L, name, local } = describe(k); const D = $("detail"); D.replaceChildren();
  const close = document.createElement("button"); close.className = "close"; close.type = "button"; close.setAttribute("aria-label", "关闭"); close.textContent = "×";
  close.onclick = () => { D.hidden = true; selectFeature(null); };
  const h = document.createElement("h2"); h.textContent = name;
  const basis = state.counties.basis_lut[state.counties.basis[ci]]; const [bz, bc] = BASIS_ZH[basis];
  const chips = document.createElement("div"); chips.style.display = "flex"; chips.style.flexWrap = "wrap"; chips.style.gap = "6px";
  const c1 = document.createElement("span"); c1.className = "chip " + bc; c1.textContent = bz; chips.append(c1);
  const bl = document.createElement("span"); bl.className = "chip"; bl.textContent = BLOC_ZH[["allied", "axis", "neutral", "contested"][sd.bloc[k]]]; chips.append(bl);
  if (sd.conf[k] === 1) { const c2 = document.createElement("span"); c2.className = "chip approx"; c2.textContent = "控制范围为近似"; chips.append(c2); }
  const dl = document.createElement("dl"); dl.className = "kv";
  const kv = (t, v) => { if (!v) return; const dt = document.createElement("dt"); dt.textContent = t; const dd = document.createElement("dd"); dd.textContent = v; dl.append(dt, dd); };
  kv("原名", local !== name ? local : null);
  kv("类别", col("county_kind", ci) || col("gb_level", ci));
  const hp = col("hist_parent_zh", ci) || col("hist_parent", ci);
  kv("历史上级", hp ? `${hp}${col("hist_parent_kind", ci) ? "（" + col("hist_parent_kind", ci) + "）" : ""}` : null);
  kv("更上一级", col("hist_grandparent", ci));
  const dp = col("defacto_parent_zh", ci) || col("defacto_parent", ci); kv("伪政权辖区", dp);
  kv("现代政区", [col("adm1_modern", ci), col("adm2_modern", ci)].filter(Boolean).join(" · ") || null);
  kv("政治单元", `${L("unit_name_zh") || L("unit_name_en")}（${STATUS_ZH[L("unit_status")] || L("unit_status")}）`);
  kv("法理宗主", L("sovereign_name_zh"));
  kv("实际控制", L("controller_name_zh") || L("controller_name_en"));
  const det = L("controller_detail_zh"); if (det && det !== L("controller_name_zh")) kv("控制细节", det);
  kv("控制方式", TYPE_ZH[L("control_type")] || L("control_type"));
  const src = L("control_source") || ""; kv("判定依据", src.startsWith("rule:") ? `人工整理规则 第 ${src.slice(5)} 行` : src.startsWith("event:") ? `控制事件 ${src.slice(6)}` : src.startsWith("overlay:") ? `历史占领图层 ${src.slice(8)}` : "CShapes 2.0 国界");
  kv("局部控制事件", L("partial_control_events"));
  kv("人口（估计）", `${fmt(sd.pop[k])}　密度 ${Math.round(sd.pop[k] / Math.max(state.counties.area[ci], 1))} 人/km²`);
  kv("面积", `${Math.round(state.counties.area[ci]).toLocaleString()} km²`);
  const foot = document.createElement("p"); foot.className = "foot"; foot.textContent = "来源：" + col("source", ci);
  D.append(close, h, chips, dl, foot); D.hidden = false;
}

function selectFeature(k) {
  if (state.selected !== null) map.setFeatureState({ source: "counties", id: state.selected }, { sel: false });
  state.selected = k;
  if (k !== null) map.setFeatureState({ source: "counties", id: k }, { sel: true });
}

async function loadSnap(snap) {
  if (!state.data[snap]) state.data[snap] = await getJSON(`data/snap-${snap}.json`);
  state.snap = snap; const sd = state.data[snap];
  for (const b of document.querySelectorAll("#tabs button")) b.setAttribute("aria-selected", String(b.dataset.snap === snap));
  $("snapTitle").textContent = `${snap.replace(/-/g, ".")}　${sd.title_zh}`;
  const top = sd.controllers.slice(0, 4).map((c) => `${c[1]} ${fmt(c[3])}`).join("、");
  $("snapLede").textContent = `${sd.feature.length.toLocaleString()} 个县级单元。人口最多的实际控制者：${top}。`;
  state.hover = null; state.selected = null; $("detail").hidden = true; $("tip").hidden = true;
  map.removeFeatureState({ source: "counties" });
  map.getSource("counties").setData(buildFeatures(sd));
  map.getSource("units").setData(unitFeatures(sd));
  setLayers(); placeLabels();
  try { history.replaceState(null, "", "#" + snap); } catch (e) {}
}

function addPattern() {
  const c = document.createElement("canvas"); c.width = c.height = 8; const g = c.getContext("2d");
  g.strokeStyle = "rgba(20,25,24,0.45)"; g.lineWidth = 1.2; g.beginPath(); g.moveTo(-2, 10); g.lineTo(10, -2); g.moveTo(-2, 2); g.lineTo(2, -2); g.moveTo(6, 10); g.lineTo(10, 6); g.stroke();
  map.addImage("hatch", g.getImageData(0, 0, 8, 8));
}

async function boot() {
  if (!window.maplibregl) { $("loading").textContent = "地图引擎未能载入，请刷新页面重试。"; return; }
  const [index, counties, geo, units] = await Promise.all([getJSON("data/index.json"), getJSON("data/counties.json"),
    getBin("data/geo.bin"), getBin("data/geo-units.bin")]);
  state.counties = counties; state.geo = decodeGeo(geo); state.units = decodeGeo(units);
  const tabs = $("tabs");
  for (const s of index.snapshots) {
    const b = document.createElement("button"); b.type = "button"; b.role = "tab"; b.dataset.snap = s.snapshot;
    const d = document.createElement("span"); d.className = "d"; d.textContent = s.snapshot.replace(/-/g, ".");
    const t = document.createElement("span"); t.className = "t"; t.textContent = s.title_zh;
    b.append(d, t); b.onclick = () => loadSnap(s.snapshot); tabs.append(b);
  }
  map = new maplibregl.Map({ container: "map", center: [60, 30], zoom: 1.6, minZoom: 1, maxZoom: 11, attributionControl: false,
    renderWorldCopies: false, style: { version: 8, sources: {}, layers: [{ id: "bg", type: "background", paint: { "background-color": cssVar("--sea") } }] } });
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
  map.addControl(new maplibregl.ScaleControl({ unit: "metric" }), "bottom-left");
  map.on("load", () => onLoad(index).catch(fail));
  wire(counties);
}

async function onLoad(index) {
    addPattern();
    map.addSource("counties", { type: "geojson", data: { type: "FeatureCollection", features: [] }, tolerance: 0.25 });
    map.addSource("units", { type: "geojson", data: { type: "FeatureCollection", features: [] }, tolerance: 0.3 });
    map.addSource("terrain", { type: "image", url: new URL("data/terrain.png", location.href).href, coordinates: [[-180, 85.0511], [180, 85.0511], [180, -85.0511], [-180, -85.0511]] });
    map.addSource("hydro", { type: "geojson", data: new URL("data/hydro.json", location.href).href });
    map.addLayer({ id: "county-fill", type: "fill", source: "counties", paint: { "fill-color": fillColor(), "fill-opacity": ["case", ["boolean", ["feature-state", "sel"], false], 0.95, 0.72] } });
    map.addLayer({ id: "county-approx", type: "fill", source: "counties", filter: ["==", ["get", "a"], 1], paint: { "fill-pattern": "hatch", "fill-opacity": 0.6 } });
    map.addLayer({ id: "terrain", type: "raster", source: "terrain", paint: { "raster-opacity": 0.55, "raster-resampling": "linear" } });
    map.addLayer({ id: "county-line", type: "line", source: "counties", minzoom: 3, paint: { "line-color": cssVar("--ink-2"), "line-opacity": ["interpolate", ["linear"], ["zoom"], 3, 0.08, 6, 0.35], "line-width": 0.4 } });
    map.addLayer({ id: "hydro-fill", type: "fill", source: "hydro", filter: ["==", ["get", "k"], "l"], paint: { "fill-color": cssVar("--sea") } });
    map.addLayer({ id: "hydro-line", type: "line", source: "hydro", filter: ["==", ["get", "k"], "r"], paint: { "line-color": "#5f8fb3", "line-opacity": 0.75, "line-width": ["interpolate", ["linear"], ["zoom"], 1, 0.4, 6, 1.4] } });
    map.addLayer({ id: "unit-line", type: "line", source: "units", paint: { "line-color": cssVar("--ink"), "line-width": ["interpolate", ["linear"], ["zoom"], 1, 0.5, 6, 1.4], "line-opacity": 0.75 } });
    map.addLayer({ id: "county-hover", type: "line", source: "counties", paint: { "line-color": cssVar("--ink"), "line-width": ["case", ["boolean", ["feature-state", "sel"], false], 2.4, ["boolean", ["feature-state", "hov"], false], 1.4, 0] } });
    const start = (location.hash || "").slice(1);
    await loadSnap(index.snapshots.some((s) => s.snapshot === start) ? start : DEFAULT_SNAPSHOT);
    $("loading").hidden = true;
}

function wire(counties) {
  map.on("mousemove", "county-fill", (e) => {
    const f = e.features[0]; if (!f) return; map.getCanvas().style.cursor = "pointer";
    if (state.hover !== null && state.hover !== f.id) map.setFeatureState({ source: "counties", id: state.hover }, { hov: false });
    state.hover = f.id; map.setFeatureState({ source: "counties", id: f.id }, { hov: true }); showTip(e, f.id);
  });
  map.on("mouseleave", "county-fill", () => { map.getCanvas().style.cursor = ""; $("tip").hidden = true;
    if (state.hover !== null) map.setFeatureState({ source: "counties", id: state.hover }, { hov: false }); state.hover = null; });
  map.on("click", "county-fill", (e) => { const f = e.features[0]; if (!f) return; selectFeature(f.id); showDetail(f.id); });
  let pending = false; map.on("move", () => { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; placeLabels(); }); });
  map.on("moveend", placeLabels);

  for (const b of document.querySelectorAll(".seg button")) b.onclick = () => {
    state.mode = b.dataset.mode; for (const x of document.querySelectorAll(".seg button")) x.setAttribute("aria-pressed", String(x === b));
    $("legendNote").hidden = state.mode !== "bloc"; setLayers();
  };
  const vis = (id, layers) => $(id).onchange = () => layers.forEach((l) => map.setLayoutProperty(l, "visibility", $(id).checked ? "visible" : "none"));
  vis("tCounty", ["county-line"]); vis("tUnits", ["unit-line"]); vis("tTerrain", ["terrain"]); vis("tHydro", ["hydro-fill", "hydro-line"]); vis("tApprox", ["county-approx"]);
  $("tLabels").onchange = placeLabels;
  $("toggleSheet").onclick = () => { const c = $("controls"); const col = c.classList.toggle("collapsed"); $("toggleSheet").textContent = col ? "展开" : "收起"; $("toggleSheet").setAttribute("aria-expanded", String(!col)); };

  const names = counties.county_id.map((_, ci) => [ci, (counties.cols.name_zh.lut[counties.cols.name_zh.idx[ci]] || ""), (counties.cols.name.lut[counties.cols.name.idx[ci]] || "")]);
  $("q").oninput = () => {
    const q = $("q").value.trim().toLowerCase(); const R = $("results"); R.replaceChildren(); if (q.length < 1) return;
    const hits = names.filter(([, zh, en]) => zh.includes(q) || en.toLowerCase().includes(q)).slice(0, 8);
    for (const [ci, zh, en] of hits) {
      const li = document.createElement("li"); const b = document.createElement("button"); b.type = "button";
      const a = document.createElement("span"); a.textContent = zh || en;
      const m = document.createElement("span"); m.className = "meta"; m.textContent = [col("hist_parent_zh", ci) || col("hist_parent", ci) || col("adm1_modern", ci), counties.cols.iso3.lut[counties.cols.iso3.idx[ci]]].filter(Boolean).join(" · ");
      b.append(a, m); b.onclick = () => {
        const [x, y] = counties.label[ci]; map.flyTo({ center: [x, y], zoom: 7 });
        const sd = state.data[state.snap]; const k = sd.feature.findIndex((f) => counties.feature_county[f] === ci);
        if (k >= 0) { selectFeature(k); showDetail(k); }
      };
      li.append(b); R.append(li);
    }
  };
  const mq = window.matchMedia("(prefers-color-scheme: dark)");
  const retheme = () => { if (!map || !map.getLayer("county-hover") || !state.snap) return; map.setPaintProperty("bg", "background-color", cssVar("--sea"));
    map.setPaintProperty("hydro-fill", "fill-color", cssVar("--sea")); map.setPaintProperty("unit-line", "line-color", cssVar("--ink"));
    map.setPaintProperty("county-hover", "line-color", cssVar("--ink")); map.setPaintProperty("county-line", "line-color", cssVar("--ink-2")); setLayers(); };
  mq.addEventListener?.("change", retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
}

function ensureLib() {
  if (window.maplibregl) return boot().catch(fail);
  const urls = ["https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js", "https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js",
    "https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"];
  const next = () => { const u = urls.shift(); if (!u) return fail(new Error("maplibre")); const s = document.createElement("script"); s.src = u;
    s.onload = () => boot().catch(fail); s.onerror = next; document.head.append(s); };
  next();
}
function fail(e) { console.error(e); $("loading").hidden = false; $("loading").textContent = "数据载入失败：" + (e && e.message ? e.message : e); }
ensureLib();
</script>
